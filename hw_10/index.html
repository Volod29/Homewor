<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>CSS Weather Forecast</title>
</head>
<body>
    <div class="container-fluid main d-flex flex-column align-items-center">
        <h1 class="text-center title">CSS Weather Forecast ☀️</h1>
        <div class="row justify-content-center mt-10"> <!-- Збільшено відступ зверху -->
            <div class="col-md-4 weather-box" style="background-color: #00aaff;">
                <h3>Lisbon</h3>
                <p>21°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #99ccff;">
                <h3>Paris</h3>
                <p>11°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #ffcccb;">
                <h3>Belgrade</h3>
                <p>15°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #ff6666;">
                <h3>Venice</h3>
                <p>21°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #ffcc99;">
                <h3>Tel-Aviv</h3>
                <p>25°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #ffeb99;">
                <h3>Cair</h3>
                <p>27°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #ffccff;">
                <h3>New-York</h3>
                <p>17°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #99ff99;">
                <h3>New-Delhi</h3>
                <p>17°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #66b3ff;">
                <h3>San-Francisco</h3>
                <p>20°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #b3e0ff;">
                <h3>Tokyo</h3>
                <p>8°C</p>
            </div>
            <div class="col-md-4 weather-box" style="background-color: #d9b3ff;">
                <h3>Sydney</h3>
                <p>25°C</p>
            </div>
        </div>
        <footer class="text-center mt-4">
            <p>Have a nice day and don't forget umbrellas if you are in New Delhi now!</p>
        </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
